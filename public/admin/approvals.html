<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Geeky Researcher | Student Approvals</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = { theme: { extend: { fontFamily: { sans: ['Inter', 'sans-serif'] }, colors: { brand: { light: '#14b8a6', DEFAULT: '#0f766e', dark: '#115e59' } } } } }
    </script>
    <style>
        body { background-color: #f8fafc; color: #0f172a; }
        .admin-card { background: white; border: 1px solid #e2e8f0; border-radius: 0.5rem; box-shadow: 0 1px 3px 0 rgb(0 0 0 / 0.1), 0 1px 2px -1px rgb(0 0 0 / 0.1); }
        .btn-primary { background: #0f766e; color: white; border-radius: 0.375rem; font-weight: 500; padding: 0.375rem 0.75rem; transition: background 0.2s; }
        .btn-primary:hover { background: #115e59; }
        .btn-danger { background: white; border: 1px solid #fca5a5; color: #ef4444; border-radius: 0.375rem; font-weight: 500; padding: 0.375rem 0.75rem; transition: all 0.2s; }
        .btn-danger:hover { background: #fef2f2; border-color: #ef4444; }
        .sidebar-link { display: flex; align-items: center; gap: 0.75rem; padding: 0.75rem 1rem; color: #94a3b8; border-radius: 0.375rem; font-weight: 500; transition: all 0.2s; }
        .sidebar-link:hover { background: #1e293b; color: #f8fafc; }
        .sidebar-link.active { background: #1e293b; color: white; border-left: 4px solid #14b8a6; }
    </style>
</head>
<body class="antialiased overflow-hidden w-full h-screen flex">

    <div class="w-64 bg-slate-900 flex-col hidden md:flex shrink-0 z-10 shadow-xl">
        <div class="flex items-center gap-3 p-6 border-b border-slate-800">
            <img src="https://res.cloudinary.com/dzuxwvamy/image/upload/v1783935221/WhatsApp_Image_2026-07-08_at_6.25.14_PM_aiuvde.jpg" class="w-10 h-10 rounded bg-white p-1 object-cover">
            <div class="font-bold text-white leading-tight text-sm">Geeky Researcher<br><span class="text-brand-light font-normal text-xs">Admin Console</span></div>
        </div>
        <nav class="flex-1 space-y-1 p-4">
            <a href="dashboard.html" class="sidebar-link"><i class="fa-solid fa-chart-line w-5 text-center"></i> Dashboard</a>
            <a href="approvals.html" class="sidebar-link active"><i class="fa-solid fa-user-check w-5 text-center"></i> Student Approvals</a>
            <a href="content-builder.html" class="sidebar-link"><i class="fa-solid fa-folder-plus w-5 text-center"></i> Content Builder</a>
            <a href="test-creator.html" class="sidebar-link"><i class="fa-solid fa-vial w-5 text-center"></i> Test Creator</a>
            <a href="reports.html" class="sidebar-link"><i class="fa-solid fa-file-invoice w-5 text-center"></i> Reports</a>
        </nav>
        <div class="p-4 border-t border-slate-800">
            <button onclick="logout()" class="w-full text-left text-sm text-red-400 font-medium hover:text-red-300 py-2 transition"><i class="fa-solid fa-sign-out-alt mr-2"></i>Sign Out</button>
        </div>
    </div>

    <div class="flex-1 p-6 md:p-8 overflow-hidden flex flex-col h-full bg-slate-50">
        <div class="mb-6">
            <h2 class="text-2xl font-bold text-slate-900">Verification Queue</h2>
            <p class="text-sm text-slate-500 mt-1">Review payments for new registrations and plan upgrades.</p>
        </div>
        
        <div class="admin-card flex-1 overflow-hidden flex flex-col">
            <div class="overflow-x-auto flex-1">
                <table class="w-full text-left text-sm text-slate-600">
                    <thead class="bg-slate-100 border-b border-slate-200 text-slate-700 font-semibold sticky top-0">
                        <tr>
                            <th class="px-6 py-4">Student Identity</th>
                            <th class="px-6 py-4">Access Level</th>
                            <th class="px-6 py-4">Request Type / Plan</th>
                            <th class="px-6 py-4 text-right">Action</th>
                        </tr>
                    </thead>
                    <tbody id="approvals-tbody" class="divide-y divide-slate-100 bg-white">
                        <tr><td colspan="4" class="text-center py-10 text-slate-500"><i class="fa-solid fa-circle-notch fa-spin mr-2"></i> Loading queue...</td></tr>
                    </tbody>
                </table>
            </div>
            <div class="p-4 border-t border-slate-200 bg-slate-50 text-sm text-slate-500 font-medium" id="table-footer">Loading...</div>
        </div>
    </div>

    <script>
        const API_BASE_URL = '/api';
        const token = localStorage.getItem('token');
        const user = JSON.parse(localStorage.getItem('user'));

        if (!token || !user || user.role !== 'admin') { localStorage.clear(); window.location.href = '../login.html'; }

        document.addEventListener('DOMContentLoaded', loadApprovals);

        async function loadApprovals() {
            const tbody = document.getElementById('approvals-tbody');
            try {
                const response = await fetch(`${API_BASE_URL}/admin/pending-approvals`, { headers: { 'Authorization': `Bearer ${token}` } });
                const data = await response.json();
                tbody.innerHTML = '';
                
                if(data.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="4" class="text-center py-10 text-slate-500">Queue is empty. No pending payments.</td></tr>`;
                    document.getElementById('table-footer').innerHTML = '0 pending requests';
                    return;
                }

                document.getElementById('table-footer').innerHTML = `${data.length} pending requests`;

                data.forEach(student => {
                    
                    // Differentiate between New User and an Upgrade request
                    const isUpgrade = student.status === 'pending_upgrade';
                    const badgeClass = isUpgrade ? 'bg-blue-50 text-blue-700 border-blue-200' : 'bg-amber-50 text-amber-700 border-amber-200';
                    const typeText = isUpgrade ? 'Plan Upgrade (Pay Remaining)' : `New Registration (${student.paymentPlan || '100'}% Plan)`;

                    tbody.innerHTML += `
                        <tr class="hover:bg-slate-50 transition duration-150">
                            <td class="px-6 py-4">
                                <div class="font-bold text-slate-900">${student.name}</div>
                                <div class="text-xs text-slate-500 mt-1">${student.email} • ${student.organization}</div>
                                <div class="text-xs text-slate-400 mt-1"><i class="fa-solid fa-phone mr-1"></i> ${student.mobile}</div>
                            </td>
                            <td class="px-6 py-4 font-medium text-slate-800">${student.level}</td>
                            <td class="px-6 py-4">
                                <span class="${badgeClass} px-2.5 py-1 rounded-md text-xs font-semibold border">
                                    ${typeText}
                                </span>
                            </td>
                            <td class="px-6 py-4 text-right space-x-2">
                                <button onclick="approveStudent('${student.email}', this)" class="btn-primary text-xs">Verify Payment & Approve</button>
                                ${!isUpgrade ? `<button onclick="declineStudent('${student.email}', this)" class="btn-danger text-xs">Decline New User</button>` : ''}
                            </td>
                        </tr>
                    `;
                });
            } catch (err) { tbody.innerHTML = `<tr><td colspan="4" class="text-center py-10 text-red-500">Failed to connect to server.</td></tr>`; }
        }

        async function approveStudent(email, btnElement) {
            btnElement.disabled = true; btnElement.innerHTML = `<i class="fa-solid fa-circle-notch fa-spin"></i>`;
            try {
                const res = await fetch(`${API_BASE_URL}/admin/approve-student`, { method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` }, body: JSON.stringify({ email }) });
                if(res.ok) { btnElement.closest('tr').remove(); loadApprovals(); } 
                else { alert('Approval failed.'); btnElement.innerHTML = `Verify Payment & Approve`; btnElement.disabled = false; }
            } catch (e) { alert('Network error.'); btnElement.innerHTML = `Verify Payment & Approve`; btnElement.disabled = false; }
        }

        async function declineStudent(email, btnElement) {
            if(!confirm("Permanently decline and remove this new registration?")) return;
            btnElement.disabled = true; btnElement.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i>`;
            try {
                const res = await fetch(`${API_BASE_URL}/admin/decline-student`, { method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` }, body: JSON.stringify({ email }) });
                if(res.ok) btnElement.closest('tr').remove();
            } catch (e) { btnElement.disabled = false; btnElement.innerHTML = `Decline New User`; }
        }

        function logout() { localStorage.clear(); window.location.href = '../login.html'; }
    </script>
</body>
</html>
