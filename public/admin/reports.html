<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Geeky Researcher | Admin Reports</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>tailwind.config = { theme: { extend: { fontFamily: { sans: ['Inter', 'sans-serif'] }, colors: { brand: { light: '#14b8a6', DEFAULT: '#0f766e', dark: '#115e59' } } } } }</script>
    <style>
        body { background-color: #f8fafc; color: #0f172a; }
        .admin-card { background: white; border: 1px solid #e2e8f0; border-radius: 0.5rem; box-shadow: 0 1px 3px 0 rgb(0 0 0 / 0.1); }
        .btn-secondary { background: white; color: #334155; border: 1px solid #cbd5e1; border-radius: 0.375rem; padding: 0.375rem 0.75rem; font-weight: 500; transition: all 0.2s; }
        .btn-secondary:hover { background: #f1f5f9; border-color: #94a3b8; }
        .sidebar-link { display: flex; align-items: center; gap: 0.75rem; padding: 0.75rem 1rem; color: #94a3b8; border-radius: 0.375rem; font-weight: 500; transition: all 0.2s; }
        .sidebar-link:hover { background: #1e293b; color: #f8fafc; }
        .sidebar-link.active { background: #1e293b; color: white; border-left: 4px solid #14b8a6; }
    </style>
</head>
<body class="antialiased overflow-hidden w-full h-screen flex">

    <div class="w-64 bg-slate-900 flex-col hidden md:flex shrink-0 z-10 shadow-xl">
        <div class="flex items-center gap-3 p-6 border-b border-slate-800">
            <img src="https://res.cloudinary.com/dzuxwvamy/image/upload/v1783935221/WhatsApp_Image_2026-07-08_at_6.25.14_PM_aiuvde.jpg" class="w-10 h-10 rounded bg-white p-1 object-cover">
            <div class="font-bold text-white leading-tight text-sm">Geeky Researcher<br><span class="text-brand-light font-normal text-xs">Admin Console</span></div>
        </div>
        <nav class="flex-1 space-y-1 p-4">
            <a href="dashboard.html" class="sidebar-link"><i class="fa-solid fa-chart-line w-5 text-center"></i> Dashboard</a>
            <a href="approvals.html" class="sidebar-link"><i class="fa-solid fa-user-check w-5 text-center"></i> Student Approvals</a>
            <a href="content-builder.html" class="sidebar-link"><i class="fa-solid fa-folder-plus w-5 text-center"></i> Content Builder</a>
            <a href="test-creator.html" class="sidebar-link"><i class="fa-solid fa-vial w-5 text-center"></i> Test Creator</a>
            <a href="reports.html" class="sidebar-link active"><i class="fa-solid fa-file-invoice w-5 text-center"></i> Reports</a>
        </nav>
        <div class="p-4 border-t border-slate-800">
            <button onclick="logout()" class="w-full text-left text-sm text-red-400 font-medium hover:text-red-300 py-2 transition"><i class="fa-solid fa-sign-out-alt mr-2"></i>Sign Out</button>
        </div>
    </div>

    <div class="flex-1 p-6 md:p-8 overflow-hidden flex flex-col h-full bg-slate-50">
        <div class="mb-6 flex justify-between items-end shrink-0">
            <div><h2 class="text-2xl font-bold text-slate-900">Student Analytics</h2><p class="text-sm text-slate-500 mt-1">Aggregated progress metrics and assessment tracking.</p></div>
            <button class="btn-secondary text-sm"><i class="fa-solid fa-file-csv mr-2"></i> Export CSV</button>
        </div>

        <div class="admin-card flex-1 overflow-hidden flex flex-col">
            <div class="overflow-x-auto flex-1">
                <table class="w-full text-left text-sm text-slate-600">
                    <thead class="bg-slate-100 border-b border-slate-200 text-slate-700 font-semibold sticky top-0">
                        <tr>
                            <th class="px-6 py-4">Student & Dept</th>
                            <th class="px-6 py-4">Assessment Taken</th>
                            <th class="px-6 py-4 text-center">Score</th>
                            <th class="px-6 py-4 text-center">Status</th>
                            <th class="px-6 py-4 text-right">Date Submitted</th>
                        </tr>
                    </thead>
                    <tbody id="reports-tbody" class="divide-y divide-slate-100 bg-white">
                        <tr><td colspan="5" class="text-center py-10 text-slate-500"><i class="fa-solid fa-circle-notch fa-spin"></i> Loading test data...</td></tr>
                    </tbody>
                </table>
            </div>
            <div class="p-4 border-t border-slate-200 bg-slate-50 text-sm text-slate-500 font-medium" id="report-footer">Loading...</div>
        </div>
    </div>

    <!-- Modal for Detailed Responses (Optional Enhancement) -->
    <div id="response-modal" class="hidden fixed inset-0 z-50 bg-slate-900/80 backdrop-blur-sm flex items-center justify-center p-4">
        <div class="bg-white rounded-xl shadow-2xl w-full max-w-3xl max-h-[90vh] flex flex-col overflow-hidden">
            <div class="p-6 border-b border-slate-200 flex justify-between items-center bg-slate-50">
                <h3 class="text-lg font-bold text-slate-900">Student Assessment Review</h3>
                <button onclick="document.getElementById('response-modal').classList.add('hidden')" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-times text-xl"></i></button>
            </div>
            <div class="p-6 overflow-y-auto bg-white flex-1 custom-scrollbar" id="response-content">
                <!-- Dynamic Review Injected Here -->
            </div>
        </div>
    </div>

    <script>
        const API_BASE_URL = 'http://localhost:5000/api';
        const token = localStorage.getItem('token');
        const user = JSON.parse(localStorage.getItem('user'));
        
        if (!token || !user || user.role !== 'admin') { localStorage.clear(); window.location.href = '../login.html'; }
        let reportsData = [];
        let testsData = []; // NEW: Store test definitions

        document.addEventListener('DOMContentLoaded', async () => {
            const tbody = document.getElementById('reports-tbody');
            try {
                // Fetch tests so we can map Q IDs to Question Text
                const testsRes = await fetch(`${API_BASE_URL}/admin/tests`, { headers: { 'Authorization': `Bearer ${token}` } });
                testsData = await testsRes.json();

                const res = await fetch(`${API_BASE_URL}/admin/reports`, { headers: { 'Authorization': `Bearer ${token}` } });
                reportsData = await res.json();
                
                // Sort by newest first
                reportsData.sort((a,b) => new Date(b.submittedAt) - new Date(a.submittedAt));

                tbody.innerHTML = '';
                
                if(reportsData.length === 0) return tbody.innerHTML = '<tr><td colspan="5" class="text-center py-10 text-slate-500">No assessments have been submitted yet.</td></tr>';

                reportsData.forEach(r => {
                    const scoreColor = r.passed ? 'text-emerald-600' : 'text-red-500';
                    const statusBadge = r.passed ? '<span class="bg-emerald-50 text-emerald-700 px-2.5 py-1 rounded-md text-xs font-bold border border-emerald-200">PASSED</span>' : '<span class="bg-red-50 text-red-700 px-2.5 py-1 rounded-md text-xs font-bold border border-red-200">FAILED</span>';
                    const date = new Date(r.submittedAt).toLocaleString(undefined, { dateStyle: 'medium', timeStyle: 'short' });

                    tbody.innerHTML += `
                        <tr class="hover:bg-slate-50 transition duration-150 cursor-pointer" onclick="viewResponses('${r.id}')">
                            <td class="px-6 py-4"><div class="font-bold text-slate-900">${r.studentName}</div><div class="text-xs font-medium text-slate-500">${r.department}</div></td>
                            <td class="px-6 py-4 font-semibold text-slate-700">${r.testTitle}</td>
                            <td class="px-6 py-4 text-center">
                                <div class="font-extrabold ${scoreColor} text-lg">${r.scorePercentage}%</div>
                                <div class="text-[10px] text-slate-400 font-bold uppercase tracking-wide">${r.totalScore} / ${r.maxScore} Marks</div>
                            </td>
                            <td class="px-6 py-4 text-center">${statusBadge}</td>
                            <td class="px-6 py-4 text-right font-medium text-slate-500 text-xs">${date}</td>
                        </tr>
                    `;
                });
                document.getElementById('report-footer').innerText = `Displaying ${reportsData.length} assessment records`;
            } catch (e) { tbody.innerHTML = '<tr><td colspan="5" class="text-center py-10 text-red-500">Failed to generate reports.</td></tr>'; }
        });

        function viewResponses(id) {
            const report = reportsData.find(r => r.id === id);
            if(!report) return;

            const test = testsData.find(t => t.id === report.testId);
            const container = document.getElementById('response-content');

            if (!test) {
                container.innerHTML = `<div class="bg-amber-50 text-amber-700 p-4 rounded border border-amber-200 text-sm">The original test definition could not be found. Raw data:<br><pre class="mt-4 p-4 bg-slate-900 text-green-400 rounded overflow-x-auto">${JSON.stringify(report.responses, null, 2)}</pre></div>`;
                document.getElementById('response-modal').classList.remove('hidden');
                return;
            }

            let html = `<div class="space-y-4">`;
            
            test.questions.forEach((q, idx) => {
                const studentAnsRaw = report.responses[q.id];
                let studentAnsText = "<span class='text-slate-400 italic'>No Answer Provided</span>";

                if (studentAnsRaw) {
                    if (q.type === 'fib') {
                        studentAnsText = studentAnsRaw;
                    } else if (Array.isArray(studentAnsRaw) && studentAnsRaw.length > 0) {
                        studentAnsText = studentAnsRaw.map(optIdx => q.options[parseInt(optIdx)] || `Unknown Option`).join('<span class="text-slate-300 mx-1">|</span>');
                    }
                }

                let correctAnsText = q.type === 'fib' ? (q.correctOptions[0] || '') : q.correctOptions.map(optIdx => q.options[parseInt(optIdx)]).join('<span class="text-slate-300 mx-1">|</span>');

                // Validate if correct (Backend already did this, this is just for UI display)
                let isCorrect = false;
                if (q.type === 'fib') {
                    isCorrect = studentAnsRaw && typeof studentAnsRaw === 'string' && studentAnsRaw.trim().toLowerCase() === correctAnsText.trim().toLowerCase();
                } else if (Array.isArray(studentAnsRaw)) {
                    const sortedStudent = [...studentAnsRaw].sort();
                    const sortedCorrect = [...q.correctOptions].sort();
                    isCorrect = studentAnsRaw.length > 0 && sortedStudent.length === sortedCorrect.length && sortedStudent.every((val, index) => val === sortedCorrect[index]);
                }

                const badge = isCorrect 
                    ? `<span class="bg-emerald-100 text-emerald-700 px-2 py-0.5 rounded text-[10px] font-bold border border-emerald-200 ml-2">CORRECT</span>`
                    : `<span class="bg-red-100 text-red-700 px-2 py-0.5 rounded text-[10px] font-bold border border-red-200 ml-2">INCORRECT</span>`;

                html += `
                    <div class="bg-slate-50 p-4 rounded-lg border border-slate-200">
                        <div class="flex justify-between items-start mb-3">
                            <p class="font-bold text-slate-800 text-sm">Q${idx+1}: ${q.text}</p>
                            ${badge}
                        </div>
                        <div class="space-y-1 text-sm bg-white p-3 rounded border border-slate-100 shadow-sm">
                            <p class="text-slate-700"><span class="font-semibold text-slate-500 w-24 inline-block">Student:</span> <span class="${isCorrect ? 'text-emerald-600 font-medium' : 'text-red-600 font-medium'}">${studentAnsText}</span></p>
                            <p class="text-slate-700"><span class="font-semibold text-slate-500 w-24 inline-block">Answer Key:</span> ${correctAnsText}</p>
                        </div>
                    </div>
                `;
            });
            html += `</div>`;

            container.innerHTML = html;
            document.getElementById('response-modal').classList.remove('hidden');
        }

        function logout() { localStorage.clear(); window.location.href = '../login.html'; }
    </script>
</body>
</html>
